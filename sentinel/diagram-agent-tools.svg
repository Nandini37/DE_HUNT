<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#94A3B8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="640" fill="#F8FAFC"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">JOB_MONITOR_AGENT  Tools &amp; When Used</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#64748B">Snowflake Cortex Agent with 5 callable tools</text>

  <!-- Center agent -->
  <rect x="325" y="240" width="250" height="100" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC">JOB_MONITOR_AGENT</text>
  <text x="450" y="292" text-anchor="middle" font-size="10" fill="#94A3B8">ELT_STAGEDB.LOGGING</text>
  <text x="450" y="310" text-anchor="middle" font-size="9" fill="#64748B">Budget: 120s � 32k tokens</text>
  <text x="450" y="326" text-anchor="middle" font-size="9" fill="#F87171" font-style="italic">Never apply fixes without approval</text>

  <!-- Tool: QueryJobs -->
  <line x1="450" y1="240" x2="450" y2="168" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="88" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">QueryJobs</text>
  <text x="450" y="130" text-anchor="middle" font-size="9" fill="#64748B">SP_QUERY_JOBS</text>
  <text x="450" y="146" text-anchor="middle" font-size="9" fill="#475569">FAILURES � LONG_RUNNING � DATA_QUALITY</text>
  <text x="450" y="160" text-anchor="middle" font-size="8" fill="#059669">Used in: Detect mode</text>

  <!-- Tool: code_execution -->
  <line x1="325" y1="280" x2="200" y2="200" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="120" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">code_execution</text>
  <text x="140" y="162" text-anchor="middle" font-size="9" fill="#64748B">Built-in Cortex tool</text>
  <text x="140" y="178" text-anchor="middle" font-size="9" fill="#475569">Analyze error patterns</text>
  <text x="140" y="192" text-anchor="middle" font-size="8" fill="#059669">Used in: Detect mode</text>

  <!-- Tool: SendAlert -->
  <line x1="575" y1="280" x2="700" y2="200" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="120" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#0078D4">SendAlert</text>
  <text x="760" y="162" text-anchor="middle" font-size="9" fill="#64748B">SP_SEND_TEAMS_ALERT</text>
  <text x="760" y="178" text-anchor="middle" font-size="9" fill="#475569">CRITICAL � WARNING � INFO</text>
  <text x="760" y="192" text-anchor="middle" font-size="8" fill="#D97706">Used in: Detect + Execute</text>

  <!-- Tool: CreateBug -->
  <line x1="350" y1="340" x2="200" y2="420" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="400" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#0078D4">CreateBug</text>
  <text x="140" y="442" text-anchor="middle" font-size="9" fill="#64748B">SP_CREATE_AZURE_DEVOPS_BUG</text>
  <text x="140" y="458" text-anchor="middle" font-size="9" fill="#475569">Azure DevOps Work Item</text>
  <text x="140" y="472" text-anchor="middle" font-size="8" fill="#059669">Used in: Execute mode (first)</text>

  <!-- Tool: GitCreatePR -->
  <line x1="550" y1="340" x2="700" y2="420" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="400" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#0078D4">GitCreatePR</text>
  <text x="760" y="442" text-anchor="middle" font-size="9" fill="#64748B">SP_GIT_CREATE_PR</text>
  <text x="760" y="458" text-anchor="middle" font-size="9" fill="#475569">Branch + commit + PR</text>
  <text x="760" y="472" text-anchor="middle" font-size="8" fill="#059669">Used in: Execute mode (second)</text>

  <!-- Two modes -->
  <rect x="40" y="510" width="400" height="110" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">Detect mode</text>
  <text x="240" y="552" text-anchor="middle" font-size="10" fill="#64748B">Triggered by Task 1 � SP_DETECT_AND_ALERT</text>
  <text x="56" y="574" font-size="10" fill="#475569">1. QueryJobs � fetch failure JSON</text>
  <text x="56" y="590" font-size="10" fill="#475569">2. code_execution � analyze root cause</text>
  <text x="56" y="606" font-size="10" fill="#475569">3. Draft fix � AGENT_SUGGESTIONS � SendAlert</text>

  <rect x="460" y="510" width="400" height="110" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">Execute mode</text>
  <text x="660" y="552" text-anchor="middle" font-size="10" fill="#64748B">Triggered by Task 3 � SP_EXECUTE_APPROVED_FIXES</text>
  <text x="476" y="574" font-size="10" fill="#475569">1. CreateBug � Azure DevOps work item</text>
  <text x="476" y="590" font-size="10" fill="#475569">2. GitCreatePR � branch fix/proposal-{id}</text>
  <text x="476" y="606" font-size="10" fill="#475569">3. SendAlert � notify Teams with PR + Bug links</text>

  <!-- Agent rules box -->
  <rect x="200" y="360" width="500" height="56" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="450" y="382" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Agent rules (from plan �6)</text>
  <text x="450" y="400" text-anchor="middle" font-size="9" fill="#64748B">Always create Bug BEFORE PR � PR must reference Bug ID � Branch: fix/proposal-{proposal_id}</text>

  <text x="450" y="632" text-anchor="middle" font-size="9" fill="#94A3B8">sentinel/plan.md �6 Cortex Agent � 2026-06-17</text>
</svg>
