<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#94A3B8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="620" fill="#F8FAFC"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Two-Table Design - Suggestion Lifecycle</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#64748B">Drafts live in SUGGESTIONS - Approved plans live in PROPOSALS</text>

  <!-- Start -->
  <rect x="50" y="100" width="160" height="56" rx="6" fill="#1E293B" stroke="#475569" filter="url(#shadow)"/>
  <text x="130" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#F8FAFC">JOB_MONITOR_AGENT</text>
  <text x="130" y="140" text-anchor="middle" font-size="10" fill="#94A3B8">analyzes failure</text>

  <line x1="210" y1="128" x2="248" y2="128" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="229" y="120" text-anchor="middle" font-size="9" fill="#D97706">drafts</text>

  <!-- AGENT_SUGGESTIONS -->
  <rect x="250" y="88" width="200" height="80" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">AGENT_SUGGESTIONS</text>
  <text x="350" y="130" text-anchor="middle" font-size="10" fill="#78350F">Working drafts - revisable</text>
  <text x="350" y="146" text-anchor="middle" font-size="10" fill="#78350F">STATUS = DRAFT</text>
  <text x="350" y="162" text-anchor="middle" font-size="9" fill="#B45309">Overwritten on each revision</text>

  <!-- Human gate -->
  <line x1="450" y1="128" x2="488" y2="128" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <rect x="490" y="88" width="180" height="80" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">Human reviews</text>
  <text x="580" y="130" text-anchor="middle" font-size="10" fill="#6D28D9">Teams - Streamlit - SQL</text>
  <text x="580" y="146" text-anchor="middle" font-size="10" fill="#6D28D9">Approve - Reject - Revise</text>

  <!-- Three decision branches -->
  <line x1="580" y1="168" x2="580" y2="210" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="490" y="212" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="580" y="235" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Human decision</text>

  <!-- Branch: Revise -->
  <path d="M 490 230 L 350 230 L 350 170" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-purple)"/>
  <rect x="260" y="200" width="180" height="60" rx="6" fill="#FEF3C7" stroke="#7C3AED" stroke-dasharray="4,3"/>
  <text x="350" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">Request revision</text>
  <text x="350" y="238" text-anchor="middle" font-size="9" fill="#6D28D9">UPDATE same row</text>
  <text x="350" y="252" text-anchor="middle" font-size="9" fill="#6D28D9">REVISION_COUNT++</text>

  <!-- Branch: Reject -->
  <path d="M 490 248 L 200 248 L 200 170" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <rect x="60" y="220" width="140" height="56" rx="6" fill="#FEF2F2" stroke="#DC2626"/>
  <text x="130" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#DC2626">Reject</text>
  <text x="130" y="258" text-anchor="middle" font-size="9" fill="#B91C1C">DELETE from SUGGESTIONS</text>
  <text x="130" y="270" text-anchor="middle" font-size="9" fill="#B91C1C">No trace in proposals</text>

  <!-- Branch: Approve -->
  <path d="M 670 230 L 730 230" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="700" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">approve</text>

  <rect x="732" y="200" width="148" height="60" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="806" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">Approve</text>
  <text x="806" y="238" text-anchor="middle" font-size="9" fill="#047857">INSERT - PROPOSALS</text>
  <text x="806" y="252" text-anchor="middle" font-size="9" fill="#047857">DELETE from SUGGESTIONS</text>

  <!-- AGENT_FIX_PROPOSALS -->
  <line x1="806" y1="260" x2="806" y2="310" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="706" y="312" width="200" height="80" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="806" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">AGENT_FIX_PROPOSALS</text>
  <text x="806" y="354" text-anchor="middle" font-size="10" fill="#047857">Approved plans only</text>
  <text x="806" y="370" text-anchor="middle" font-size="10" fill="#047857">Immutable once inserted</text>
  <text x="806" y="386" text-anchor="middle" font-size="9" fill="#059669">STATUS: APPROVED - APPLIED</text>

  <!-- Execute -->
  <line x1="806" y1="392" x2="806" y2="430" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="706" y="432" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="806" y="454" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">TASK_EXECUTE_FIXES</text>
  <text x="806" y="472" text-anchor="middle" font-size="10" fill="#64748B">Agent - Bug + PR</text>
  <text x="806" y="488" text-anchor="middle" font-size="9" fill="#64748B">BUG_ID - PR_URL set</text>

  <!-- Comparison table -->
  <rect x="50" y="320" width="520" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#shadow)"/>
  <text x="70" y="346" font-size="13" font-weight="700" fill="#334155">Table comparison</text>

  <rect x="70" y="360" width="220" height="24" rx="4" fill="#FEF3C7" stroke="#D97706"/>
  <text x="180" y="376" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">AGENT_SUGGESTIONS</text>
  <rect x="310" y="360" width="240" height="24" rx="4" fill="#D1FAE5" stroke="#059669"/>
  <text x="430" y="376" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">AGENT_FIX_PROPOSALS</text>

  <text x="80" y="402" font-size="10" fill="#64748B">Purpose</text>
  <text x="180" y="402" text-anchor="middle" font-size="9" fill="#78350F">Working drafts</text>
  <text x="430" y="402" text-anchor="middle" font-size="9" fill="#047857">Final approved plans</text>
  <line x1="70" y1="410" x2="540" y2="410" stroke="#E2E8F0"/>

  <text x="80" y="428" font-size="10" fill="#64748B">Who writes</text>
  <text x="180" y="428" text-anchor="middle" font-size="9" fill="#78350F">Agent (UPSERT)</text>
  <text x="430" y="428" text-anchor="middle" font-size="9" fill="#047857">System on approval</text>
  <line x1="70" y1="436" x2="540" y2="436" stroke="#E2E8F0"/>

  <text x="80" y="454" font-size="10" fill="#64748B">Lifecycle</text>
  <text x="180" y="454" text-anchor="middle" font-size="9" fill="#78350F">Revised or deleted</text>
  <text x="430" y="454" text-anchor="middle" font-size="9" fill="#047857">Never modified</text>
  <line x1="70" y1="462" x2="540" y2="462" stroke="#E2E8F0"/>

  <text x="80" y="480" font-size="10" fill="#64748B">Triggers</text>
  <text x="180" y="480" text-anchor="middle" font-size="9" fill="#78350F">Teams review poll</text>
  <text x="430" y="480" text-anchor="middle" font-size="9" fill="#047857">Bug + PR creation</text>
  <line x1="70" y1="488" x2="540" y2="488" stroke="#E2E8F0"/>

  <text x="80" y="506" font-size="10" fill="#64748B">Key fields</text>
  <text x="180" y="506" text-anchor="middle" font-size="9" fill="#78350F">REVISION_COUNT, FIX_CODE</text>
  <text x="430" y="506" text-anchor="middle" font-size="9" fill="#047857">BUG_ID, PR_URL, APPLIED_AT</text>

  <text x="450" y="560" text-anchor="middle" font-size="9" fill="#94A3B8">sentinel/plan.md #23 - 2026-06-17</text>
</svg>